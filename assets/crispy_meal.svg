<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2a1a10" />
      <stop offset="60%" stop-color="#140d08" />
      <stop offset="100%" stop-color="#0a0604" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f0ece1" />
      <stop offset="100%" stop-color="#d9d2c1" />
    </linearGradient>
    <linearGradient id="crispyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <linearGradient id="fryYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
    <linearGradient id="toastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9" />
      <stop offset="50%" stop-color="#e2a76f" />
      <stop offset="100%" stop-color="#ba6b38" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGlow)" />

  <!-- Wire Mesh Rack Pattern -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="50" y1="50" x2="550" y2="350" />
    <line x1="100" y1="50" x2="550" y2="310" />
    <line x1="50" y1="100" x2="500" y2="350" />
    <line x1="550" y1="50" x2="50" y2="350" />
    <line x1="500" y1="50" x2="50" y2="310" />
    <line x1="550" y1="100" x2="100" y2="350" />
  </g>

  <!-- Main White Oval Bowl Plate -->
  <ellipse cx="300" cy="210" rx="200" ry="130" fill="url(#goldPlate)" filter="url(#shadow)" />
  <ellipse cx="300" cy="210" rx="180" ry="115" fill="#fcfbfa" stroke="#e8e2d5" stroke-width="2" />

  <!-- Side Salad Bowl (Coleslaw) -->
  <ellipse cx="120" cy="100" rx="60" ry="40" fill="url(#goldPlate)" filter="url(#shadow)" />
  <ellipse cx="120" cy="100" rx="52" ry="34" fill="#ffffff" />
  <path d="M 90 95 Q 120 85 150 95 Q 130 115 100 105 Z" fill="#78e08f" opacity="0.7" />
  <path d="M 95 100 Q 120 90 145 102 Q 135 110 105 110 Z" fill="#ffeaa7" />

  <!-- Sliced Toast Bread (Right Side) -->
  <g transform="translate(380, 110)">
    <path d="M0,20 Q15,0 35,5 Q45,25 30,80 Q10,85 0,70 Z" fill="url(#toastGrad)" stroke="#8c4411" stroke-width="2" />
    <path d="M15,22 Q30,5 50,10 Q60,30 45,85 Q25,90 15,75 Z" fill="url(#toastGrad)" stroke="#8c4411" stroke-width="2" />
    <path d="M30,24 Q45,7 65,12 Q75,32 60,87 Q40,92 30,77 Z" fill="url(#toastGrad)" stroke="#8c4411" stroke-width="2" />
    <path d="M45,26 Q60,9 80,14 Q90,34 75,89 Q55,94 45,79 Z" fill="url(#toastGrad)" stroke="#8c4411" stroke-width="2" />
  </g>

  <!-- French Fries Base -->
  <g opacity="0.9">
    <rect x="200" y="180" width="12" height="70" rx="3" fill="url(#fryYellow)" transform="rotate(-15 200 180)" />
    <rect x="220" y="175" width="10" height="75" rx="3" fill="url(#fryYellow)" transform="rotate(10 220 175)" />
    <rect x="240" y="185" width="11" height="65" rx="3" fill="url(#fryYellow)" transform="rotate(-5 240 185)" />
    <rect x="260" y="170" width="12" height="80" rx="3" fill="url(#fryYellow)" transform="rotate(25 260 170)" />
    <rect x="280" y="190" width="10" height="60" rx="3" fill="url(#fryYellow)" transform="rotate(-20 280 190)" />
  </g>

  <!-- Crispy Fried Chicken Tenders (Center & Top) -->
  <g filter="url(#shadow)">
    <!-- Tender 1 -->
    <path d="M 180 200 C 190 160, 250 150, 270 190 C 260 220, 200 230, 180 200 Z" fill="url(#crispyGold)" stroke="#b33939" stroke-width="2" />
    <!-- Tender 2 -->
    <path d="M 230 220 C 250 180, 320 170, 340 210 C 330 245, 250 250, 230 220 Z" fill="url(#crispyGold)" stroke="#b33939" stroke-width="2" />
    <!-- Tender 3 -->
    <path d="M 280 180 C 300 130, 360 140, 375 185 C 360 215, 300 210, 280 180 Z" fill="url(#crispyGold)" stroke="#b33939" stroke-width="2" />
    <!-- Tender 4 (Bottom) -->
    <path d="M 220 240 C 240 210, 300 220, 310 255 C 290 275, 230 270, 220 240 Z" fill="url(#crispyGold)" stroke="#b33939" stroke-width="2" />
  </g>

  <!-- Crispy Crunch Flakes Details -->
  <circle cx="210" cy="185" r="3" fill="#ffd32a" />
  <circle cx="245" cy="195" r="4" fill="#ffc048" />
  <circle cx="295" cy="165" r="3" fill="#ffd32a" />
  <circle cx="330" cy="205" r="4" fill="#ffc048" />
  <circle cx="260" cy="235" r="3" fill="#ffd32a" />

  <!-- Overlay Badge Ribbon -->
  <rect x="20" y="320" width="220" height="50" rx="12" fill="rgba(20, 15, 10, 0.85)" stroke="url(#crispyGold)" stroke-width="2" />
  <text x="35" y="345" font-family="'Noto Sans Arabic', sans-serif" font-weight="bold" font-size="18" fill="#ffffff">وجبة كرسبي</text>
  <text x="35" y="362" font-family="'Noto Sans Arabic', sans-serif" font-size="12" fill="#ffb347">يقدم مع بطاطا مقلية</text>
  <text x="175" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffd700">9,000 IQD</text>
</svg>
